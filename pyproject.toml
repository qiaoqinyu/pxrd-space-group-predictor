[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xraypro-spacegroup"
version = "0.1.0.dev1"
description = "PXRD- and molecule-guided space-group screening for molecular crystals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.optional-dependencies]
verification = ["dtaidistance>=2.3"]
structures = ["rdkit>=2024.3", "pymatgen>=2024.5", "ase>=3.23"]
embedding = [
  "safetensors>=0.4",
  "tokenizers>=0.19",
  "transformers>=4.41",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
